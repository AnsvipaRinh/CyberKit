name: Build CyberKit (Track S) - renamed WebKit for iOS 14

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (arm64 = our patched-MobileSafari path)'
        required: true
        default: 'arm64'
      wk_prefix:
        description: 'ObjC class rename prefix (WKWebView -> <prefix>WebView)'
        required: false
        default: 'WP'

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: toolchain + deps. Cheap and reliable; cached for the next stages.
  # ---------------------------------------------------------------------------
  deps:
    name: "1/3 deps (bmalloc, WTF, icu, CyberScriptCore)"
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: 14.0
      TARGET_ARCH: ${{ github.event.inputs.arch }}
      WK_PREFIX: ${{ github.event.inputs.wk_prefix }}
      CACHE_VER: v2
    steps:
      - name: Checkout CyberKit fork (safari-7616 branch + our wp-ci assets)
        uses: actions/checkout@v4
        with:
          ref: safari-7616.1.27.211-branch
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Install build dependencies (Ruby 3.x, gperf, bison, flex, ninja, cmake)
        # WebKit's derived-sources steps shell out to these. Missing gperf made
        # CyberCore's process-css-properties.py die right where every hosted run
        # stopped (no error output, job ended within ~2 min). Ruby >= 3.2 removed
        # File.exists? which the check-for-* scripts call.
        run: |
          set -e
          which ruby || brew install ruby
          ruby --version
          which ruby || brew install ruby
          ruby --version
          which gperf || brew install gperf
          which bison || brew install bison
          which flex   || brew install flex
          which ninja  || (brew install ninja || echo "  ninja missing (optional)")
          which cmake  || brew install cmake
          which rename || brew install rename
          gperf --version | head -1
          gperf --version | head -1

      - name: Apply SDK-compat patch for vendored XPC SPI (iPhoneOS 16.4+ SDK conflict)
        run: python3 .github/wp-ci/wp-xpcspi-compat.py .

      - name: Apply SDK-compat patch for unavailable private XPC SPI (iOS 16.4+ SDK)
        run: python3 .github/wp-ci/wp-xpcavail-compat.py .

      - name: Apply SDK-compat patch for removed objc-runtime umbrella
        run: python3 .github/wp-ci/wp-objcruntime-compat.py .

      - name: Apply SDK-compat patch for readline usage in jsc.cpp (iOS SDK lacks readline)
        run: python3 .github/wp-ci/wp-jsc-compat.py .

      - name: Apply SDK-compat patch for SDK-exposed AVFoundation SPI (iOS 17 SDK)
        run: python3 .github/wp-ci/wp-avspi-compat.py .

      - name: Apply WP patch for Ruby >= 3.2 (File.exists? removed)
        run: python3 .github/wp-ci/wp-ruby-compat.py .

      - name: Apply WP class rename (OUR step — ObjC classes, fixes M5 co-load)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-classes.sh \
            apply ./Source --include-headers

      - name: Apply CyberKit framework rename (THEIR script — frameworks/bundles + com.apple -> com.matthewbenedict)
        run: bash script_rename.sh

      - name: Apply WP bundle IDs (OUR step — com.matthewbenedict.* -> space.webportkit.*)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-bundles.sh \
            apply ./Source --include-headers

      - name: Build deps and cache them
        run: |
          set -euo pipefail
          df -h / | sed 's/^/  pre-build: /'
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          SRC="$(xcrun --sdk iphoneos --show-sdk-path)"
          BUILD="$PWD/CyberKitBuild"
          # Bash array (not a flat string): a flat string is word-split, which
          # breaks space-separated FRAMEWORK_SEARCH_PATHS.
          # ARCHS: single arch. arm64 is what our validated device path uses
          # (MobileSafari patched arm64e->arm64).
          COMMON=(-sdk "$SRC" -configuration Release -quiet ARCHS="${TARGET_ARCH:-arm64}" ONLY_ACTIVE_ARCH=NO
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= -jobs 2
            "SYMROOT=$BUILD" "OBJROOT=$BUILD"
            "CONFIGURATION_BUILD_DIR=$BUILD/Release-iphoneos"
            "FRAMEWORK_SEARCH_PATHS=$SRC/System/Library/Frameworks $BUILD/Release-iphoneos"
            "LIBRARY_SEARCH_PATHS=$SRC/usr/lib $BUILD/Release-iphoneos")
          # bmalloc before WTF: WTFConfig.h includes bmalloc's GigacageConfig.h.
          xcodebuild -project Source/bmalloc/bmalloc.xcodeproj "${COMMON[@]}" -target bmalloc
          xcodebuild -project Source/WTF/WTF.xcodeproj "${COMMON[@]}" -target WTF
          xcodebuild -project Source/WTF/WTF.xcodeproj "${COMMON[@]}" -target icu
          xcodebuild -project Source/CyberScriptCore/CyberScriptCore.xcodeproj "${COMMON[@]}" -target CyberScriptCore
          echo "=== stage1 done:"; ls "$BUILD/Release-iphoneos" | head

      - name: Save deps cache
        uses: actions/cache/save@v4
        with:
          path: |
            CyberKitBuild
          key: ${{ env.CACHE_VER }}-deps

  # ---------------------------------------------------------------------------
  # Stage 2: the memory hog. Cached separately so a runner eviction only costs
  # this segment, never the whole build. libwebrtc/ANGLE/WebGPU are deliberately
  # NOT built: CyberCore links them weakly (LC_LOAD_WEAK_DYLIB) and we reuse the
  # released binaries at packaging time.
  # ---------------------------------------------------------------------------
  webcore:
    name: "2/3 webcore (CyberCore, CyberKitLegacy)"
    needs: deps
    runs-on: macos-14
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: 14.0
      TARGET_ARCH: ${{ github.event.inputs.arch }}
      WK_PREFIX: ${{ github.event.inputs.wk_prefix }}
      CACHE_VER: v2
    steps:
      - name: Checkout CyberKit fork (safari-7616 branch + our wp-ci assets)
        uses: actions/checkout@v4
        with:
          ref: safari-7616.1.27.211-branch
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install build dependencies (Ruby 3.x, gperf, bison, flex, ninja, cmake)
        run: |
          set -e
          which ruby || brew install ruby
          which ruby || brew install ruby
          ruby --version
          which gperf || brew install gperf
          which bison || brew install bison
          which flex   || brew install flex
          which ninja  || (brew install ninja || echo "  ninja missing (optional)")
          which cmake  || brew install cmake
          which rename || brew install rename
          gperf --version | head -1

      - name: Apply SDK-compat patch for vendored XPC SPI (iPhoneOS 16.4+ SDK conflict)
        run: python3 .github/wp-ci/wp-xpcspi-compat.py .

      - name: Apply SDK-compat patch for unavailable private XPC SPI (iOS 16.4+ SDK)
        run: python3 .github/wp-ci/wp-xpcavail-compat.py .

      - name: Apply SDK-compat patch for removed objc-runtime umbrella
        run: python3 .github/wp-ci/wp-objcruntime-compat.py .

      - name: Apply SDK-compat patch for readline usage in jsc.cpp (iOS SDK lacks readline)
        run: python3 .github/wp-ci/wp-jsc-compat.py .

      - name: Apply SDK-compat patch for SDK-exposed AVFoundation SPI (iOS 17 SDK)
        run: python3 .github/wp-ci/wp-avspi-compat.py .

      - name: Apply WP patch for Ruby >= 3.2 (File.exists? removed)
        run: python3 .github/wp-ci/wp-ruby-compat.py .

      - name: Apply WP class rename (OUR step — ObjC classes, fixes M5 co-load)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-classes.sh \
            apply ./Source --include-headers

      - name: Apply CyberKit framework rename (THEIR script — frameworks/bundles + com.apple -> com.matthewbenedict)
        run: bash script_rename.sh

      - name: Apply WP bundle IDs (OUR step — com.matthewbenedict.* -> space.webportkit.*)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-bundles.sh \
            apply ./Source --include-headers

      - name: Restore build cache (deps stage output)
        uses: actions/cache/restore@v4
        with:
          path: |
            CyberKitBuild
          key: ${{ env.CACHE_VER }}-deps
          restore-keys: |
            ${{ env.CACHE_VER }}-

      - name: Verify cache has the deps
        run: |
          set -euo pipefail
          ls CyberKitBuild/Release-iphoneos 2>/dev/null | head -20
          for f in WTF.framework bmalloc.framework icu CyberScriptCore.framework; do
            [ -e "CyberKitBuild/Release-iphoneos/$f" ] || { echo "MISSING in cache: $f"; exit 1; }
          done
          echo "cache OK"

      - name: Build webcore
        run: |
          set -euo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          SRC="$(xcrun --sdk iphoneos --show-sdk-path)"
          BUILD="$PWD/CyberKitBuild"
          COMMON=(-sdk "$SRC" -configuration Release -quiet ARCHS="${TARGET_ARCH:-arm64}" ONLY_ACTIVE_ARCH=NO
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= -jobs 2
            "SYMROOT=$BUILD" "OBJROOT=$BUILD"
            "CONFIGURATION_BUILD_DIR=$BUILD/Release-iphoneos"
            "FRAMEWORK_SEARCH_PATHS=$SRC/System/Library/Frameworks $BUILD/Release-iphoneos"
            "LIBRARY_SEARCH_PATHS=$SRC/usr/lib $BUILD/Release-iphoneos")
          # Serial: this is the target on which every hosted runner died.
          xcodebuild -project Source/CyberCore/CyberCore.xcodeproj "${COMMON[@]}" -target CyberCore COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild -project Source/CyberKitLegacy/CyberKitLegacy.xcodeproj "${COMMON[@]}" -target CyberKitLegacy
          echo "=== stage2 done:"; ls "$BUILD/Release-iphoneos" | head

      - name: Save webcore cache
        uses: actions/cache/save@v4
        with:
          path: |
            CyberKitBuild
          key: ${{ env.CACHE_VER }}-webcore

  # ---------------------------------------------------------------------------
  # Stage 3: main framework + XPC services, packaging with reused weak deps.
  # ---------------------------------------------------------------------------
  kit:
    name: "3/3 CyberKit + services + package"
    needs: webcore
    runs-on: macos-14
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: 14.0
      TARGET_ARCH: ${{ github.event.inputs.arch }}
      WK_PREFIX: ${{ github.event.inputs.wk_prefix }}
      CACHE_VER: v2
    steps:
      - name: Checkout CyberKit fork (safari-7616 branch + our wp-ci assets)
        uses: actions/checkout@v4
        with:
          ref: safari-7616.1.27.211-branch
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install build dependencies (Ruby 3.x, gperf, bison, flex, ninja, cmake)
        run: |
          set -e
          which ruby || brew install ruby
          which ruby || brew install ruby
          ruby --version
          which gperf || brew install gperf
          which bison || brew install bison
          which flex   || brew install flex
          which ninja  || (brew install ninja || echo "  ninja missing (optional)")
          which cmake  || brew install cmake
          which rename || brew install rename
          gperf --version | head -1

      - name: Apply SDK-compat patch for vendored XPC SPI (iPhoneOS 16.4+ SDK conflict)
        run: python3 .github/wp-ci/wp-xpcspi-compat.py .

      - name: Apply SDK-compat patch for unavailable private XPC SPI (iOS 16.4+ SDK)
        run: python3 .github/wp-ci/wp-xpcavail-compat.py .

      - name: Apply SDK-compat patch for removed objc-runtime umbrella
        run: python3 .github/wp-ci/wp-objcruntime-compat.py .

      - name: Apply SDK-compat patch for readline usage in jsc.cpp (iOS SDK lacks readline)
        run: python3 .github/wp-ci/wp-jsc-compat.py .

      - name: Apply SDK-compat patch for SDK-exposed AVFoundation SPI (iOS 17 SDK)
        run: python3 .github/wp-ci/wp-avspi-compat.py .

      - name: Apply WP patch for Ruby >= 3.2 (File.exists? removed)
        run: python3 .github/wp-ci/wp-ruby-compat.py .

      - name: Apply WP class rename (OUR step — ObjC classes, fixes M5 co-load)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-classes.sh \
            apply ./Source --include-headers

      - name: Apply CyberKit framework rename (THEIR script — frameworks/bundles + com.apple -> com.matthewbenedict)
        run: bash script_rename.sh

      - name: Apply WP bundle IDs (OUR step — com.matthewbenedict.* -> space.webportkit.*)
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-bundles.sh \
            apply ./Source --include-headers

      - name: Restore build cache (webcore stage output)
        uses: actions/cache/restore@v4
        with:
          path: |
            CyberKitBuild
          key: ${{ env.CACHE_VER }}-webcore
          restore-keys: |
            ${{ env.CACHE_VER }}-

      - name: Verify cache has the deps + webcore
        run: |
          set -euo pipefail
          for f in WTF.framework bmalloc.framework CyberScriptCore.framework CyberCore.framework CyberKitLegacy.framework; do
            [ -e "CyberKitBuild/Release-iphoneos/$f" ] || { echo "MISSING in cache: $f"; exit 1; }
          done
          echo "cache OK"

      - name: Build CyberKit + XPC services
        run: |
          set -euo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          SRC="$(xcrun --sdk iphoneos --show-sdk-path)"
          BUILD="$PWD/CyberKitBuild"
          COMMON=(-sdk "$SRC" -configuration Release -quiet ARCHS="${TARGET_ARCH:-arm64}" ONLY_ACTIVE_ARCH=NO
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= -jobs 2
            "SYMROOT=$BUILD" "OBJROOT=$BUILD"
            "CONFIGURATION_BUILD_DIR=$BUILD/Release-iphoneos"
            "FRAMEWORK_SEARCH_PATHS=$SRC/System/Library/Frameworks $BUILD/Release-iphoneos"
            "LIBRARY_SEARCH_PATHS=$SRC/usr/lib $BUILD/Release-iphoneos")
          for t in CyberKit WebContent Networking GPU webpushd adattributiond CyberKitPlatform; do
            echo "  * $t"
            xcodebuild -project Source/CyberKit/CyberKit.xcodeproj "${COMMON[@]}" -target "$t"
          done
          echo "=== stage3 build done:"; ls "$BUILD/Release-iphoneos" | head -20

      - name: "Add weak dependencies (reused from release, not built)"
        run: |
          set -euo pipefail
          BUILD="$PWD/CyberKitBuild/Release-iphoneos"
          mkdir -p wp-weakdeps && cd wp-weakdeps
          curl -fsSL -o weakdeps.tgz \
            https://github.com/AnsvipaRinh/WebPortKit/releases/download/weakdeps-v1/wp-weakdeps-v1.tgz
          tar -xzf weakdeps.tgz
          cp -R libwebrtc.dylib libANGLE-shared.dylib _libJetsamConfigurator.dylib "$BUILD"/
          cp -R WebGPU.framework "$BUILD"/
          ls "$BUILD" | grep -E "webrtc|ANGLE|WebGPU|Jetsam" || true

      - name: Package + verify architectures
        run: |
          set -euo pipefail
          BUILD="$PWD/CyberKitBuild/Release-iphoneos"
          OUT="$PWD/donor-out"; rm -rf "$OUT"; mkdir -p "$OUT/Frameworks"
          for fw in "$BUILD"/*.framework; do cp -R "$fw" "$OUT/Frameworks/"; done
          for lib in "$BUILD"/*.dylib; do cp "$lib" "$OUT/Frameworks/"; done
          echo "=== frameworks:"; ls "$OUT/Frameworks"
          echo "=== architectures (expect ${TARGET_ARCH}, no others):"
          for f in "$OUT"/Frameworks/*.framework/* "$OUT"/Frameworks/*.dylib; do
            file "$f" 2>/dev/null | grep -o "Mach-O 64-bit [a-z0-9 ]*object" | head -1 | sed "s#^#  $(basename "$f"): #"
          done
          echo "=== XPC services shipped:"
          ls "$OUT"/Frameworks/*.framework/XPCServices 2>/dev/null | head -20
          tar -czf cyberkit-donor.tgz -C "$OUT" Frameworks
          ls -la cyberkit-donor.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberkit-donor-${{ github.sha }}
          path: cyberkit-donor.tgz
          retention-days: 14
          overwrite: true
