name: Build CyberKit (Track S) - renamed WebKit for iOS 14

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'Target iOS deployment version (P0: 14.x)'
        required: true
        default: '14.0'
      wk_prefix:
        description: 'ObjC class rename prefix (WKWebView -> <prefix>WebView)'
        required: false
        default: 'WP'

jobs:
  build-cyberkit:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: ${{ github.event.inputs.ios_version }}
      WK_PREFIX: ${{ github.event.inputs.wk_prefix }}
    steps:
      # Дизайн: форк CyberKit несёт наши rename-ассеты в .github/wp-ci/
      # (кладёт push-to-fork.sh). Отдельного checkout нашего репо НЕТ —
      # у него нет remote, на раннере это бы не сработало.
      - name: Checkout CyberKit fork (safari-7616 branch + our wp-ci assets)
        uses: actions/checkout@v4
        with:
          ref: safari-7616.1.27.211-branch
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Install Ruby (for build scripts)
        run: |
          which ruby || brew install ruby
          ruby --version

      - name: Apply SDK-compat patch for vendored XPC SPI (iPhoneOS 16.4+ SDK conflict)
        # Root cause of CI failure: WTF's vendored XPCSPI.h re-declares
        # XPC_ACTIVITY_STATE_* / xpc_*_t, which the modern iOS SDK ships in
        # <xpc/xpc.h> (via activity.h) -> hard redefinition errors as -Werror.
        # libwebrtc (vpx/aom/absl) itself compiles fine; not the blocker.
        run: |
          python3 .github/wp-ci/wp-xpcspi-compat.py .

      - name: Apply SDK-compat patch for libwebrtc libSystem path (macOS 14 runner)
        # libwebrtc.xcodeproj hardcodes /usr/lib/libSystem.B.dylib in
        # OTHER_LDFLAGS; on macOS 11+ those dylibs live only in the dyld
        # shared cache, so Xcode fails libwebrtc with
        # "Build input file cannot be found". Repoint at $(SDKROOT).
        run: |
          python3 .github/wp-ci/wp-libwebrtc-compat.py .

      - name: Apply SDK-compat patch for unavailable private XPC SPI (iOS 16.4+ SDK)
        # CyberKit Inspector calls xpc_connection_create_mach_service, which the
        # modern iOS SDK marks "__API_UNAVAILABLE on iOS". dlsym macros keep
        # call sites compiling and resolve the private symbols at runtime.
        run: |
          python3 .github/wp-ci/wp-xpcavail-compat.py .

      - name: Apply SDK-compat patch for removed objc-runtime umbrella
        # Modern SDKs dropped the legacy <objc/objc-runtime.h> umbrella.
        run: |
          python3 .github/wp-ci/wp-objcruntime-compat.py .

      - name: Apply SDK-compat patch for readline usage in jsc.cpp (iOS SDK lacks readline)
        run: |
          python3 .github/wp-ci/wp-jsc-compat.py .

      - name: Apply SDK-compat patch for SDK-exposed AVFoundation SPI (iOS 17 SDK)
        # iOS 17.4+ SDK exposes the private AVVideoPerformanceMetrics interface,
        # clashing with PAL/spi/cocoa/AVFoundationSPI.h's vendored copy.
        run: |
          python3 .github/wp-ci/wp-avspi-compat.py .

      - name: Apply WP class rename (OUR step — ObjC classes, fixes M5 co-load)        # \b-границы не задевают C API (WKPageRef и т.п.); заголовки включаем:
        # @interface-декларации обязаны переименоваться вместе с .mm.
        # Ассеты лежат в форке (.github/wp-ci/), кладёт push-to-fork.sh.
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-classes.sh \
            apply ./Source --include-headers

      - name: Apply CyberKit framework rename (THEIR script — frameworks/bundles + com.apple -> com.matthewbenedict)
        run: |
          export WK_PREFIX=${{ github.event.inputs.wk_prefix }}
          if [ -f "Tools/Scripts/script_rename.sh" ]; then
            ./Tools/Scripts/script_rename.sh
          else
            echo "script_rename.sh not found, skipping rename"
          fi

      - name: Apply WP bundle IDs (OUR step — com.matthewbenedict.* -> space.webportkit.*)
        # ПОСЛЕ их скрипта (он создаёт matthewbenedict-ID). XPC/песочницы/кэши обязаны быть
        # нашими, иначе коллизия с установленным CyberKit на том же устройстве. Замерено: 353.
        run: |
          WP_ALLOW_IN_PLACE=1 bash .github/wp-ci/wp-rename-ids.sh apply ./Source

      - name: Build donor frameworks (minimal target set, throttled)
        # The whole-workspace build-webkit run exceeds the GitHub macOS runner's
        # practical limits (runs consistently died ~55min in, at the CyberCore
        # stage -- disk/memory pressure on the hosted runner). We build only the
        # projects needed for the rendering stack + XPC daemons, throttled to
        # 2 xcodebuild jobs:
        #   libwebrtc, ANGLE, WTF(+icu), bmalloc, CyberCore, CyberScriptCore,
        #   CyberKitLegacy, WebGPU, CyberKit (aggregate 'Everything')
        # Skipping: WebInspectorUI, WebDriver, jsc CLI, minibrowser, all test
        # targets -- none of them are in the iPhone-side Frameworks/ directory.
        run: |
          set -euo pipefail
          df -h / | sed 's/^/  pre-build: /'
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          SRC="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON="-sdk $SRC -configuration Release ARCHS=arm64e ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= -jobs 2 \
            SYMROOT=\$PWD/CyberKitBuild OBJROOT=\$PWD/CyberKitBuild \
            CONFIGURATION_BUILD_DIR=\$PWD/CyberKitBuild/Release-iphoneos"
          build_project() {
            echo "== (helper unused) =="
          }
          :
          # libwebrtc (WebCore dependency), whole project (all targets are deps)
          xcodebuild -project Source/ThirdParty/libwebrtc/libwebrtc.xcodeproj $COMMON
          # ANGLE
          xcodebuild -project Source/ThirdParty/ANGLE/ANGLE.xcodeproj $COMMON -target ANGLE
          # bmalloc must be built before WTF: WTFConfig.h includes bmalloc's
          # generated GigacageConfig.h.
          xcodebuild -project Source/bmalloc/bmalloc.xcodeproj $COMMON -target bmalloc
          # WTF (+icu)
          xcodebuild -project Source/WTF/WTF.xcodeproj $COMMON -target WTF
          xcodebuild -project Source/WTF/WTF.xcodeproj $COMMON -target icu
          # WebGPU (frameworks used by the GPU path)
          [ -d Source/WebGPU/WebGPU.xcodeproj ] && xcodebuild -project Source/WebGPU/WebGPU.xcodeproj $COMMON -target WebGPU || echo "  (WebGPU project absent, skipped)"
          # CyberCore (legacy WebCore)
          xcodebuild -project Source/CyberCore/CyberCore.xcodeproj $COMMON -target CyberCore
          # CyberScriptCore (JSC)
          xcodebuild -project Source/CyberScriptCore/CyberScriptCore.xcodeproj $COMMON -target CyberScriptCore
          # CyberKitLegacy
          xcodebuild -project Source/CyberKitLegacy/CyberKitLegacy.xcodeproj $COMMON -target CyberKitLegacy
          # CyberKit: main framework + XPC daemons (WebContent/Networking/GPU),
          # webpushd/adattributiond daemons and the platform lib. Explicit targets
          # (not the 'Everything' aggregate) to avoid building test runners.
          for t in CyberKit WebContent Networking GPU webpushd adattributiond CyberKitPlatform; do
            xcodebuild -project Source/CyberKit/CyberKit.xcodeproj $COMMON -target "$t"
          done
          df -h / | sed 's/^/  post-build: /'

      - name: Package CyberKit frameworks
        run: |
          mkdir -p build/package/Frameworks
          # Copy built frameworks from build directory
          cp -R build/Release/*.framework build/package/Frameworks/ 2>/dev/null || true
          cp -R build/Release-iphoneos/*.framework build/package/Frameworks/ 2>/dev/null || true
          # Also check WebKitBuild
          cp -R WebKitBuild/Release/*.framework build/package/Frameworks/ 2>/dev/null || true
          cp -R WebKitBuild/Release-iphoneos/*.framework build/package/Frameworks/ 2>/dev/null || true
          # Create manifest
          ls -la build/package/Frameworks/ > build/package/MANIFEST.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyberkit-ios${{ github.event.inputs.ios_version }}-${{ github.event.inputs.wk_prefix }}
          path: |
            build/package/Frameworks/
            build/package/MANIFEST.txt
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cyberkit-ios${{ github.event.inputs.ios_version }}-${{ github.event.inputs.wk_prefix }}-${{ github.run_number }}
          name: CyberKit iOS ${{ github.event.inputs.ios_version }} (${{ github.event.inputs.wk_prefix }}) - Build ${{ github.run_number }}
          files: |
            build/package/Frameworks/*.framework
            build/package/MANIFEST.txt
          generate_release_notes: true